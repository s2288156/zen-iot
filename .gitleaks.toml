# gitleaks 8.x+ 默认启用全部 built-in rules，本文件只做项目级例外收窄
# TOML 注意：literal string '''...''' 不做任何转义，$ 后跟数字会被 TOML 解析器误判为 number
# 用 basic string """...""" 配合正确转义：TOML \\ → \，regex \$ → 字面 $

[[allowlists]]
path = "admin-service/src/main/resources/application.yml"
regexTarget = secret
regex = """(
  \\$2a\\$10\\$Kw/dU22ig8dIrz9ImLCRRuhLRvQ8E8tWX94ORQRKmz1iYL2d0sHDi|
  \\$2a\\$10\\$NZ7XEuah1yYhoC6QZNzUk\\.pK\\.SbVr1wAm3oTECPxHeACd9Jc512AG|
  zen-dev-admin-service-hs256-secret-key-32-bytes
)"""
