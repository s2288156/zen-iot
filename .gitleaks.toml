# gitleaks 8.x+ 默认启用全部 built-in rules
# 本文件只做 allowlist：把确认安全的"假阳性"源排除扫描

# 直接放行整个 application.yml 中的 dev 占位密钥
# （BCrypt 密文和默认 JWT secret 在生产由环境变量覆盖）
# 用 path allowlist 比 regexTarget 更简单、零 TOML 转义风险
[[allowlists]]
path = '''admin-service/src/main/resources/application.yml'''
description = "dev placeholders: BCrypt密文 + 默认JWT secret，生产由环境变量覆盖"
