# 开发与测试基础设施：MySQL 8 + Redis 8 + Nacos 3.1.1 + RabbitMQ 4（与 Spring Boot 4.1 / Spring Cloud Alibaba 2025.1.0.0 对齐）
# 启动：docker compose -f docker/docker-compose.dev.yml up -d
# 停止：docker compose -f docker/docker-compose.dev.yml down
#
# 建库：initdb/*.sql 只在 MySQL 数据卷为空时执行。已有 zen_mysql_data 卷的开发机补一次即可：
#   docker exec zen-mysql-dev mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS zen_ecs CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
# 注意：旧卷里按 utf8mb4_unicode_ci 建的表不会自动转换，本仓库开发库请删卷重建：
#   docker compose -f docker/docker-compose.dev.yml down && docker volume rm docker_zen_mysql_data && docker compose -f docker/docker-compose.dev.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: zen-mysql-dev
    restart: unless-stopped
    # 显式钉死服务器默认字符集/排序规则（恰为 MySQL 8 默认值）：
    # MYSQL_DATABASE 建的 zen_admin 直接继承它，与 initdb 脚本及各服务 Flyway 建表语句保持同一 collation
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zen_admin
    ports:
      - "3306:3306"
    volumes:
      - zen_mysql_data:/var/lib/mysql
      # MYSQL_DATABASE 只能建一个库，业务库随各阶段用 init SQL 补；CI 侧同一份脚本（见 .github/workflows/ci.yml）
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 强制走 TCP：首启建卷阶段 entrypoint 会临时起 --skip-networking 实例，
      # 走 socket 的 localhost 会在其初始化完成前就 ping 通，导致健康状态早报
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: zen-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zen_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: zen-nacos-dev
    restart: unless-stopped
    environment:
      MODE: standalone
      # Nacos 3.x 强制要求三项鉴权配置存在（即使关闭鉴权也需要占位值）
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: Z2VuZGV2bmFjb3NhdXRoZW50b2tlbjMyYnl0ZXNceW1s
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台与 API 分离：UI 在 8080，8848 的 /nacos/ 只剩一句跳转提示
      - "8080:8080"
    volumes:
      # standalone 用内嵌 Derby，全部状态在 /home/nacos/data；不挂载则 down 一次即清空
      # （admin/ecs 的 optional:nacos:* 配置会随之丢失）
      - zen_nacos_data:/home/nacos/data
    healthcheck:
      # Nacos 3.x 健康端点从 /v1/ 迁移到 /v3/；liveness 才是就绪探针，
      # 首页 /nacos/ 在 3.x 只是「控制台在 8080」的提示文本，不表达就绪语义
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:8848/nacos/v3/admin/core/state/liveness | grep -q 200 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Phase 3 的指令中转（RCS → ECS 消费）与 Phase 9 的全链路异步都打这里。
  # 刻意不用 guest/guest：RabbitMQ 默认把 guest 限制为「只能从 broker 自身 loopback 登录」，
  # 经发布端口进来的连接源地址是网桥网关而不是 127.0.0.1，会被直接拒。
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: zen-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zen
      RABBITMQ_DEFAULT_PASS: zen
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - zen_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s

volumes:
  zen_mysql_data:
  zen_nacos_data:
  zen_redis_data:
  zen_rabbitmq_data:
