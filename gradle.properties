# 构建性能：多模块并行 + 本地构建缓存
# 若某个开关引发插件报错，单独回退该项并保留注释说明，不要整体删除本文件
org.gradle.parallel=true
org.gradle.caching=true

# configuration-cache 默认关闭：用户全局 ~/.gradle/init.gradle.kts 在 allprojects 里动态注册 repositories，
# Gradle 无法追踪这种不确定输入，每次构建都判定「配置图变化」而丢弃缓存条目，实际反而拖慢。
# 干净环境（CI / 无自定义 init script 的开发机）可通过命令行显式开启：-Dorg.gradle.configuration-cache=true
org.gradle.configuration-cache=false

# CI runner 为 7GB 内存，本地开发机按此上限也安全；编码统一避免跨平台 diff 噪音
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
