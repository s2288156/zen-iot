server:
  # 端口按 Phase 0「端口规划」分配：gateway 占 28080，业务服务从 28081 起递增
  port: 28081

spring:
  application:
    name: admin-service
  # 实测仅靠 nacos-discovery starter 即可解析 nacos: 前缀，无需再引 nacos-config starter；
  # optional 保证 Nacos 上没有该 dataId 时照常启动
  config:
    import: optional:nacos:admin-service.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/zen_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 表结构归 Flyway，Hibernate 只校验；改回 update 会与迁移脚本双重所有权
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # 含下划线的 key 在 map 里会被 IDE 提示"含特殊字符"，用 [xxx] 显式括起，
        # 避免被松散绑定按分隔符拆成 format.sql
        "[format_sql]": true
  flyway:
    placeholders:
      # 开发口令 Admin@123 / Demo@123 的 BCrypt 密文；生产由 SPRING_FLYWAY_PLACEHOLDERS_ADMINPASSWORD /
      # SPRING_FLYWAY_PLACEHOLDERS_DEMOPASSWORD 覆盖，不改本文件
      adminPassword: "$2a$10$Kw/dU22ig8dIrz9ImLCRRuhLRvQ8E8tWX94ORQRKmz1iYL2d0sHDi"
      demoPassword: "$2a$10$NZ7XEuah1yYhoC6QZNzUk.pK.SbVr1wAm3oTECPxHeACd9Jc512AG"
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        # 服务名取 spring.application.name；Phase 2 网关按该名做 lb:// 发现
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

management:
  endpoints:
    web:
      exposure:
        # 白名单收敛：Boot 默认只开 health，此处仅补 prometheus，env/beans/configprops 一律不暴露
        # /actuator/** 在 zen.security.whitelist 里免鉴权，暴露面就是匿名可读面
        include:
          - health
          - prometheus
  endpoint:
    health:
      # 打开 liveness/readiness 分组，Phase 10 K8s 探针直接打 /actuator/health/liveness 与 /readiness
      probes:
        enabled: true

zen:
  jwt:
    # HS256 密钥，UTF-8 长度必须 ≥ 32 字节；生产由 ZEN_JWT_SECRET 覆盖，并与 Phase 2 网关保持完全一致
    secret: ${ZEN_JWT_SECRET:zen-dev-admin-service-hs256-secret-key-32-bytes}
    access-ttl: 30m
    refresh-ttl: 7d
  security:
    # 本服务自解析 Token；Phase 2 之后不持密钥的业务服务改用 gateway-header
    context-source: jwt
    # 免鉴权路径：登录/刷新入口 + 文档与健康检查
    whitelist:
      - /auth/login
      - /auth/refresh
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # 只扫本模块，防止 common-core 的 @RestControllerAdvice/实体被当成本服务的接口模型
  packages-to-scan: com.zen.admin
  # 默认 */* 会让 Apifox 与 SDK 生成器拿不到 json 语义；接口实际只产 json
  default-produces-media-type: application/json
  # key 有序：文档 JSON 可作为 Apifox 定时同步与基线 diff 的稳定输入
  writer-with-order-by-keys: true
  # 刻意不开 use-fqn：模型名会变成 com.zen.admin.dto.LoginRequest 这种长串，每个工具里都要重读一遍。
  # 跨服务并档靠 operationId 前缀（见 ZenAdminOpenApiConfiguration）防撞；真撞上同名 schema，
  # 也只在涉事 DTO 上写 @Schema(name=...) 定点改，不全局切换命名策略。
