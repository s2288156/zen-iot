# 依赖更新自动化
# gradle ecosystem 直接解析 build.gradle.kts / settings.gradle.kts 里硬编码的坐标
# （含 dependencyManagement 的 mavenBom 字符串与单条 dependency 约束）与插件版本；
# 所有 PR 自动触发 .github/workflows/ci.yml，失败即人工介入，不自动合并

version: 2

updates:
  # Gradle 依赖（版本硬编码在根 build.gradle.kts 与 settings.gradle.kts）
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    # 版本分组：minor/patch 自动成组 PR，major 升级单独 PR（破坏性风险）
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: build
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
