name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 每周一早 2:00 跑 OSV 扫描（非阻断）
  schedule:
    - cron: "0 18 * * 0"

# 同 PR 新运行取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ——— 静态门禁（现有，不变）———
  check:
    name: ./gradlew check (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run check (no integration tests)
        run: ./gradlew --no-daemon clean check

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/spotbugs/
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ——— 集成测试（依赖 MySQL/Nacos/Redis 容器）———
  integration:
    name: ./gradlew check -PintegrationTests (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zen_admin
        ports:
          - 3306:3306
        # 勿在此处传 --character-set-server/--collation-server：service 容器的 options 会被拼进
        # docker create（镜像名之前），MySQL 服务端参数会让容器以 unknown flag 启动失败。
        # utf8mb4 / utf8mb4_0900_ai_ci 即 mysql:8.0 内置默认值，表级 COLLATE 已在 Flyway 脚本显式钉死
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s
      # 与 docker/docker-compose.dev.yml 同一镜像与同一套 dev 口令：
      # ecs-service 的指令中转消费者测试（@Tag("integration")）要真 broker，不能只在本机跑得绿
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: zen
          RABBITMQ_DEFAULT_PASS: zen
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Nacos 无官方 service 镜像，单独拉起并轮询就绪
      # Nacos 3.x 即使关闭鉴权也要求 NACOS_AUTH_* 三项占位值
      - name: Start Nacos and wait for readiness
        run: |
          docker run -d --name nacos-integration \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -e NACOS_AUTH_TOKEN=Z2VuZGV2bmFjb3NhdXRoZW50b2tlbjMyYnl0ZXNceW1s \
            -e NACOS_AUTH_IDENTITY_KEY=serverIdentity \
            -e NACOS_AUTH_IDENTITY_VALUE=security \
            -e JVM_XMS=512m \
            -e JVM_XMX=512m \
            -p 8848:8848 \
            -p 9848:9848 \
            nacos/nacos-server:v3.1.1
          for i in $(seq 1 36); do
            # Nacos 3.x 健康端点从 /v1/ 迁移到 /v3/；liveness 才是就绪探针（首页只是跳转提示）
            if curl -sf http://localhost:8848/nacos/v3/admin/core/state/liveness > /dev/null 2>&1; then
              echo "Nacos is ready after ${i} tries"
              exit 0
            fi
            echo "Waiting for Nacos... (try ${i}/36)"
            sleep 5
          done
          echo "ERROR: Nacos failed to start within 180s"
          docker logs nacos-integration 2>&1 | tail -50
          exit 1

      # service 容器的 MYSQL_DATABASE 同样只能建一个库，复用 compose 那份 init SQL 建 zen_ecs
      # （用 docker exec 灌进容器，避免依赖 runner 上是否装了 mysql 客户端）
      - name: Create business databases
        run: |
          mysql_id=$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -1)
          docker exec -i "$mysql_id" sh -c 'exec mysql -uroot -proot' < docker/initdb/01-create-business-databases.sql
          docker exec "$mysql_id" mysql -uroot -proot -e 'SHOW DATABASES LIKE "zen_%"'

      # Flyway 空库回放：确保迁移脚本在完全空的 MySQL 上可以完整执行
      # 镜像版本必须与运行时 flyway-core 对齐（当前 Boot BOM 管到 12.4.0，见 */build/reports/dependency-versions.txt）。
      # 原先钉在 flyway/flyway:11 比运行时低一个 major，12.x 语法的迁移脚本会「本机过、CI 红」或反向假绿；
      # 抬 Boot BOM 时要同步抬这里的 tag。
      - name: Verify Flyway migrations on empty DB
        run: |
          docker run --rm --network host \
            flyway/flyway:12.4.0 \
            -url="jdbc:mysql://localhost:3306/zen_admin?useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root \
            -password=root \
            -locations=filesystem:admin-service/src/main/resources/db/migration \
            migrate

      - name: Verify ECS Flyway migrations on empty DB
        run: |
          docker run --rm --network host \
            flyway/flyway:12.4.0 \
            -url="jdbc:mysql://localhost:3306/zen_ecs?useSSL=false&allowPublicKeyRetrieval=true" \
            -user=root \
            -password=root \
            -locations=filesystem:ecs-service/src/main/resources/db/migration \
            migrate

      - name: Run check with integration tests
        env:
          # GitHub Actions services 默认暴露到 host.docker.internal 或直接 localhost
          MYSQL_HOST: localhost
          NACOS_SERVER_ADDR: localhost:8848
          REDIS_HOST: localhost
        run: |
          ./gradlew --no-daemon clean check -PintegrationTests

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: |
            **/build/reports/spotbugs/
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ——— 密钥扫描（PR 检查变更文件，push/main 全量）———
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 该 action 不声明 with 输入（v2/v3 一致），配置文件路径走 GITLEAKS_CONFIG env
      # PR/push 扫描范围自动切换：PR = changed files, push = all
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ".gitleaks.toml"

  # ——— 依赖漏洞扫描已拆到 .github/workflows/osv-scan.yml ———
  # google/osv-scanner-action 的 reusable workflow 不能在同一 jobs 块里
  # 与普通 job 混写，独立 workflow 更干净
