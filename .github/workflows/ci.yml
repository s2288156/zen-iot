name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同 PR 新运行取消旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ./gradlew check (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run check (no integration tests)
        run: ./gradlew --no-daemon clean check

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/spotbugs/
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7
